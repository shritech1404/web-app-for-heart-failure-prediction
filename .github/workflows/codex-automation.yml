name: Codex Automated Review Pipeline

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches:
      - codexTest

permissions:
  pull-requests: write
  contents: read
  issues: write

jobs:
  codex-review:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # fetch full history

      - name: Setup dependencies
        run: |
          echo "Setting up project dependencies..."
          # e.g. npm install, pip install -r requirements.txt, etc.

      # Step 1: Run Codex review
      - name: Run Codex Review
        id: review
        continue-on-error: true
        run: |
          echo "Running Codex review..."
          # 🔧 Replace with your real codex CLI or API call
          # Example:
          # codex-cli review --format json > review-results.json

          # For now: mock result
          echo '{"status":"success","issues":0}' > review-results.json

          ISSUES=$(grep -o '"issues":[0-9]*' review-results.json | cut -d':' -f2 || echo "0")
          echo "issues_found=$ISSUES" >> $GITHUB_OUTPUT

          if [ "$ISSUES" -gt "0" ]; then
            echo "❌ Review found $ISSUES issue(s)"
            exit 1
          fi
          echo "✅ Review passed"

      # Step 2: Update documentation (only if review succeeded)
      - name: Update Documentation
        id: docs
        if: steps.review.outcome == 'success'
        continue-on-error: true
        run: |
          echo "Updating documentation..."
          # e.g. codex-cli update-docs
          echo "docs_status=updated" >> $GITHUB_OUTPUT

      # Step 3: Vulnerability scan
      - name: Security Vulnerability Scan
        id: vuln
        if: steps.review.outcome == 'success'
        continue-on-error: true
        run: |
          echo "Scanning for vulnerabilities..."
          # e.g. npm audit --json > vuln-results.json
          # Mock:
          echo '{"vulnerabilities":0}' > vuln-results.json
          VULNS=$(grep -o '"vulnerabilities":[0-9]*' vuln-results.json | cut -d':' -f2 || echo "0")
          echo "vulnerabilities_found=$VULNS" >> $GITHUB_OUTPUT
          if [ "$VULNS" -gt "0" ]; then
            echo "⚠️ Found $VULNS vulnerabilities"
            exit 1
          fi
          echo "✅ No vulnerabilities found"

      # Step 4: Performance analysis
      - name: Performance Analysis
        id: perf
        if: steps.review.outcome == 'success' && steps.vuln.outcome == 'success'
        continue-on-error: true
        run: |
          echo "Running performance analysis..."
          # e.g. codex-cli perf-summary
          echo "perf_status=analyzed" >> $GITHUB_OUTPUT

      # Step 5: Collect results & decide status
      - name: Collect Results
        id: results
        if: always()
        run: |
          REVIEW="${{ steps.review.outcome }}"
          VULN="${{ steps.vuln.outcome }}"
          if [ "$REVIEW" != "success" ]; then
            echo "overall_status=failed" >> $GITHUB_OUTPUT
            echo "failure_reason=Code review failed" >> $GITHUB_OUTPUT
          elif [ "$VULN" == "failure" ]; then
            echo "overall_status=failed" >> $GITHUB_OUTPUT
            echo "failure_reason=Vulnerabilities found" >> $GITHUB_OUTPUT
          else
            echo "overall_status=success" >> $GITHUB_OUTPUT
            echo "failure_reason=none" >> $GITHUB_OUTPUT
          fi

      # Step 6: Post review comment
      - name: Post Code Review Comment
        if: always() && steps.review.outcome != 'skipped'
        uses: peter-evans/create-or-update-comment@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            ## 🔍 Code Review
            **Status**: ${{ steps.review.outcome == 'success' && '✅ Passed' || '❌ Failed' }}
            **Issues Found**: ${{ steps.review.outputs.issues_found || '0' }}
            ${{ steps.review.outcome == 'failure' && '⚠️ Please fix the issues before proceeding.' || '' }}

      # Step 7: Post Documentation update comment
      - name: Post Docs Comment
        if: always() && steps.docs.outcome != 'skipped'
        uses: peter-evans/create-or-update-comment@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            ## 📝 Documentation Update
            **Status**: ${{ steps.docs.outcome == 'success' && '✅ Updated' || '❌ Failed' }}

      # Step 8: Post Vulnerability comment
      - name: Post Vulnerability Comment
        if: always() && steps.vuln.outcome != 'skipped'
        uses: peter-evans/create-or-update-comment@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            ## 🔒 Vulnerability Scan
            **Status**: ${{ steps.vuln.outcome == 'success' && '✅ Passed' || '⚠️ Vulnerabilities Found' }}

      # Step 9: Post Performance comment
      - name: Post Performance Comment
        if: always() && steps.perf.outcome != 'skipped'
        uses: peter-evans/create-or-update-comment@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            ## ⚡ Performance
            **Status**: ${{ steps.perf.outcome == 'success' && '✅ Analyzed' || '❌ Failed' }}

      # Step 10: Post final summary
      - name: Post Final Summary
        if: always()
        uses: peter-evans/create-or-update-comment@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            ---
            ## 🏁 Final Status
            **Overall**: ${{ steps.results.outputs.overall_status == 'success' && '✅ All checks passed' || '❌ Pipeline failed' }}
            ${{ steps.results.outputs.failure_reason != 'none' && format('**Reason**: {0}', steps.results.outputs.failure_reason) || '' }}
            [View logs](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})

      # Step 11: Fail if overall failed
      - name: Final Status Check
        if: always()
        run: |
          if [ "${{ steps.results.outputs.overall_status }}" = "failed" ]; then
            echo "❌ Some checks failed"
            exit 1
          fi
          echo "✅ All good"
