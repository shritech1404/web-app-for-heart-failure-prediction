name: Codex Automated Review Pipeline

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches:
      - codexTest

permissions:
  pull-requests: write
  contents: read

jobs:
  codex-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Setup Codex CLI via npm
        run: |
          npm install -g @openai/codex
          # add npm global bin to PATH
          echo "$(npm bin -g)" >> $GITHUB_PATH

      - name: Debug codex installation
        run: |
          which codex || echo "codex not installed"
          codex --version

      - name: Run codex review
        id: review
        run: |
          codex review

      - name: Update documentation / README
        id: docs
        run: |
          codex update-docs

      - name: Check vulnerabilities
        id: vuln
        run: |
          codex scan vulnerabilities

      - name: Performance summary
        id: perf
        run: |
          codex perf-summary

      - name: Post summary comment
        if: always()
        uses: peter-evans/create-or-update-comment@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            ## Codex Automated Review Summary  
            **Review step**: ${{ steps.review.outcome }}  
            **Docs update**: ${{ steps.docs.outcome }}  
            **Vulnerability scan**: ${{ steps.vuln.outcome }}  
            **Performance summary**: ${{ steps.perf.outcome }}  
            
            _If any step failed, subsequent checks were skipped._
