name: Codex Automated Review

on:
  pull_request:
    branches:
      - codexNew            # ← change to main/develop if needed
    types: [opened, synchronize, reopened]

jobs:
  codex-review:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ---------------- SETUP NODE ENVIRONMENT ----------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # ---------------- INSTALL CODEX CLI ----------------
      - name: Install Codex CLI (private)
        run: npm install -g @codex/cli

      # ---------------- RUN CODEX CHECKS ----------------
      - name: Run Codex checks
        run: |
          set -e
          codex lint
          codex scan vulnerabilities
          codex check-readme

      # ---------------- SUMMARY COMMENT ----------------
      - name: Post summary comment
        if: always()
        uses: peter-evans/create-or-update-comment@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            **Codex Automated Review**
            - Status: **${{ job.status }}**
            - Run: [View Logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
            ${{ job.status == 'success' && '✅ All checks passed.' || '❌ Some checks failed. See logs above.' }}
