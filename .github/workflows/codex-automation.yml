name: Codex Automated Review Pipeline

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches:
      - codexTest

permissions:
  pull-requests: write
  contents: read

jobs:
  codex-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Install Codex CLI
        run: |
          npm install -g @openai/codex
          echo "$(npm bin -g)" >> $GITHUB_PATH

      - name: Perform interactive login and upload credentials
        id: login
        run: |
          # This step fails in CI, but you can run it locally first,
          # get the auth.json, and commit or store it in GitHub secrets/storage.
          codex login
        # This step is likely not automatable in CI.

      - name: Load saved auth.json (if exists)
        run: |
          mkdir -p ~/.codex
          # e.g. restore from secret or artifact
          echo "${{ secrets.CODEX_AUTH_JSON_BASE64 }}" | base64 -d > ~/.codex/auth.json

      - name: Debug login status
        run: |
          codex login status
          codex whoami

      - name: Run review
        id: review
        run: |
          codex exec "review code"

      # Step 5: Post summary comment on the PR
      - name: Post summary comment
        if: always()
        uses: peter-evans/create-or-update-comment@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            ## Codex Automated Review Summary  
            **Review step**: ${{ steps.review.outcome }}  
            **Docs update**: ${{ steps.docs.outcome }}  
            **Vulnerability scan**: ${{ steps.vuln.outcome }}  
            **Performance summary**: ${{ steps.perf.outcome }}  
            
            _If any step failed, subsequent checks would not run._

