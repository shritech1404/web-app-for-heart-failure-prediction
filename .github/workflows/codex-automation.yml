name: Codex Automated Review

on:
  pull_request:
    branches:
      - codexNew
    types:
      - opened
      - synchronize
      - reopened

jobs:
  codex-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run lint / style checks
        run: |
          # your codex lint command
          ./codex lint
        # this will stop if exit code ≠ 0

      - name: Check vulnerabilities / dependencies
        run: |
          ./codex scan vulnerabilities
        # fails if vulnerabilities found

      - name: Ensure README / docs updated
        run: |
          ./codex check-readme
        # fail if checks not satisfied

      - name: Post summary comment
        if: always()
        uses: peter-evans/create-or-update-comment@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            ${{ job.status == 'success' && '✅ All checks passed' || '❌ Some checks failed' }}
