name: Codex Automated Review Pipeline

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches:
      - codexTest

permissions:
  pull-requests: write
  contents: read

jobs:
  codex-review:
    runs-on: ubuntu-latest
    env:
      CODEX_QUIET_MODE: "1"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Install Codex CLI
        run: |
          npm install -g @openai/codex
          echo "$(npm bin -g)" >> $GITHUB_PATH

      - name: Debug codex install
        run: |
          which codex
          codex --version || true

      - name: Run codex review non-interactive
        id: review
        run: |
          codex exec "review code"

      - name: Update documentation / README
        id: docs
        run: |
          codex --no-terminal --quiet update-docs

      - name: Check vulnerabilities
        id: vuln
        run: |
          codex --no-terminal --quiet scan vulnerabilities

      - name: Performance summary
        id: perf
        run: |
          codex --no-terminal --quiet perf-summary

      - name: Post summary comment
        if: always()
        uses: peter-evans/create-or-update-comment@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            ## Codex Automated Review Summary  
            **Review step**: ${{ steps.review.outcome }}  
            **Docs update**: ${{ steps.docs.outcome }}  
            **Vulnerability scan**: ${{ steps.vuln.outcome }}  
            **Performance summary**: ${{ steps.perf.outcome }}  
