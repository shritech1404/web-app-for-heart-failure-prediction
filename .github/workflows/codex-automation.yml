name: Codex PR Automation

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  codex-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          # get full history if needed
          fetch-depth: 0

      # Optional: install dependencies, build, etc.
      - name: Setup / build
        run: |
          # e.g., npm ci, pip install, etc.
          # Only do this if required for deeper analysis
          echo "Installing dependencies if needed"

      - name: Run Codex review & analysis
        id: run_codex
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt: |
            You are an expert code reviewer. The PR #${{ github.event.pull_request.number }} in repository ${{ github.repository }} has the following title and description:
            Title: ${{ github.event.pull_request.title }}
            Body: ${{ github.event.pull_request.body }}

            Review the **changes** in this PR. Please provide:
            1. Bug or correctness issues  
            2. Performance / optimization suggestions  
            3. Security / vulnerability risks  
            4. Documentation or README updates suggestions  
            5. Any other code quality improvements  

            Be concise but specific — for each item, reference file names and lines if possible.

      - name: Comment with Codex feedback
        if: steps.run_codex.outputs.final-message != ''
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: `**Codex Review Output:**\n\n${{ steps.run_codex.outputs.final-message }}`
            })

  # Optionally a separate job to commit documentation updates if you want the AI to automatically update docs
  update-docs:
    runs-on: ubuntu-latest
    needs: codex-review
    if: ${{ always() }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Run Codex to generate doc changes
        id: gen_docs
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt: |
            Based on the PR changes in #${{ github.event.pull_request.number }}, propose exact edits to README, docs, or comments to reflect updated behavior. Output in unified diff format or patch form.


